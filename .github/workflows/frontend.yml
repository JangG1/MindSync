name: Deploy Frontend to Oracle VM

concurrency: 
  group: production
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy Frontend to Oracle VM
      run: |
        sshpass -p "${{ secrets.SUDO_PASSWORD }}" ssh -v -o StrictHostKeyChecking=no dio@192.168.56.1 'bash -s' << EOF
          echo "permission for fonts"
          echo "${SUDO_PASSWORD}" | sudo -S chmod u+w /mindsync/frontend/build/fonts/*
          echo "${SUDO_PASSWORD}" | sudo -S chown dio:dio /mindsync/frontend/build/fonts/*
          /mindsync/deploy_front.sh
        EOF
